spring:
  application:
    name: kb-bot
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b
        temperature: 0
        num-ctx: 16384
      embedding:
        model: bge-m3
    vectorstore:
      chroma:
        client:
          host: http://localhost
          port: 8000
        collection-name: knowledge-base
        initialize-schema: true

# rag.top-k, rag.similarity-threshold, rag.chunk.max-tokens: defaults and validation live in RagProperties.
# Override here (or per profile) only when deviating from them, e.g. after threshold calibration.
