spring:
  application:
    name: kb-bot
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b
        temperature: 0
        num-ctx: 16384
      embedding:
        model: bge-m3
    vectorstore:
      chroma:
        client:
          host: http://localhost
          port: 8000
        collection-name: knowledge-base
        initialize-schema: true

rag:
  chunk:
    max-tokens: 500
  top-k: 5
  # Placeholder: embedding-model specific, calibrate on test questions (scores are logged per search).
  similarity-threshold: 0.5
